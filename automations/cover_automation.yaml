blueprint:
  name: Rollladensteuerung (Sonnenschutz, Sonnenheizen, Abend- & Nachtmodus, Sturmschutz)
  description: |
    Steuert einen einzelnen Rollladen mit binärem Fensterkontakt (offen/geschlossen):
    morgendliches Öffnen, Lüftungsposition mit Rückfahr-Logik, Abend- und Nachtfahrten,
    Sonnenschutz, Sonnenheizen und optionaler Sturmschutz. Alle Zielpositionen sind
    einstellbar; 0 % bedeutet geschlossen, 100 % vollständig geöffnet.

    Der Abendmodus führt zu einer festen Uhrzeit und/oder zum Sonnenuntergang mit Offset
    eine einzelne Fahrt aus. Beide Termine prüfen die Bedingungen erneut. Gefahren wird
    nur bei geschlossenem Fenster, wenn der Nachtmodus noch nicht aktiv ist und die
    vorhergesagte Tagestiefsttemperatur höchstens der eingestellten Schwelle entspricht.
    Ein bereits weiter geschlossener Rollladen wird dabei nicht geöffnet.
    Der Abendmodus benötigt keinen eigenen Status-Helfer und speichert keinen Zustand.
    Bei offenem Fenster entfällt die Abendfahrt; sie wird später nicht eigens nachgeholt.
    Nachtmodus und morgendliches Öffnen übernehmen über ihre jeweiligen Auslöser.

    Der Nachtmodus wird über einen gemeinsamen input_boolean-Helfer aktiviert und nutzt
    eine eigene Temperatur-Schwelle sowie getrennte Positionen für geschlossene und offene
    Fenster. Abend- und Nachtmodus prüfen die vorhergesagte Tagestiefsttemperatur für heute.
    Fehlt dieser Wert, entfällt die Temperaturprüfung.

    Sonnenschutz und Sonnenheizen verwenden die erwartete Tageshöchsttemperatur für heute:
    aus einem optionalen Tageshöchsttemperatur-Sensor oder aus der Wettervorhersage.
    Die Beschattung folgt dem Sonnenstand und führt innerhalb ihrer Temperatur-Hysterese
    weiter nach. Sonnenheizen öffnet heruntergelassene Rollläden bei passendem Sonnenstand
    und niedriger Tageshöchsttemperatur. Ohne gültigen Temperaturwert startet keines der
    beiden Features. Beide benötigen jeweils einen eigenen Status-Helfer pro Rollladen.
    Der Nachtmodus blockiert beide Sonnenfunktionen; die einmalige Abendfahrt setzt
    dagegen keine dauerhafte Sperre gegen spätere Sonnenautomatik.

    Pro Fenster/Rollladen wird eine eigene Automation erstellt. Gemeinsame Helfer für
    Morgen-/Abendzeiten und Nachtmodus können in allen Instanzen identisch gewählt werden.
    Bei Fensteröffnung wird nur bis zur Lüftungsposition geöffnet, sofern der Rollladen
    aktuell weiter geschlossen ist. Innerhalb des Rückfahr-Zeitfensters kann anschließend
    die Ausgangsposition wiederhergestellt werden.

    Basiert auf "s42 - Intelligente Rollladensteuerung V2" von TheRealSimon42, lokal
    angepasst für binäre Fensterkontakte, ohne Kipp-Erkennung und ohne Moskito-Modus.

    📖 [Dokumentation](https://github.com/JonasKa23/ha-blueprints/blob/main/docs/cover_automation.md)
  domain: automation
  author: JonasKa23
  homeassistant:
    min_version: 2026.9.0
  source_url: https://github.com/JonasKa23/ha-blueprints/blob/main/automations/cover_automation.yaml
  input:
    assignment_section:
      name: Zuordnung
      description: |
        Der Rollladen und der zugehörige Fenstersensor.
      icon: mdi:vector-link
      input:
        cover:
          name: Rollladen
          description: |
            Der Rollladen, den diese Automation steuert.
          selector:
            entity:
              domain: cover
        window_sensor:
          name: Fenstersensor
          description: |
            Der Fensterkontakt zu diesem Rollladen. Es wird ein einfacher binärer Schließkontakt
            erwartet (offen/geschlossen) — kein Drei-Zustands-Sensor mit Kipp-Erkennung. Hinweis:
            Der Sensor erscheint in der Auswahl nur mit passender Geräteklasse (Tür, Fenster,
            Öffnung oder Garagentor) — die lässt sich in den Einstellungen der Entität nachrüsten.
          selector:
            entity:
              domain: binary_sensor
              device_class:
                - door
                - window
                - opening
                - garage_door
    weather_section:
      name: Wetter
      description: |
        Die Wetter-Entität, die als gemeinsame Datenquelle für mehrere Features dient:
        Windgeschwindigkeit für den Sturmschutz, die maximale Tagestemperatur (Vorhersage) als
        Fallback für den Sonnenschutz (sofern dort kein eigener Temperatursensor gesetzt ist),
        sowie die minimale Tagestemperatur (Vorhersage) für Abend- und Nachtmodus.
      icon: mdi:weather-partly-cloudy
      input:
        weather_entity:
          name: Wetter-Entität
          description: |
            Deine Wetter-Entität (z.B. von DWD oder der Standard-Integration). Wird für den
            Sturmschutz (wind_speed-Attribut, sofern kein eigener Wind-Sensor gesetzt ist), als
            Tageshöchsttemperatur- Fallback für den Sonnenschutz sowie für die Tagestiefsttemperatur
            im Abend- und Nachtmodus verwendet (jeweils über die Tagesvorhersage der Entität).
            Optional, aber ohne sie benötigt der Sturmschutz einen eigenen Wind-Sensor und
            Abend-/Nachtmodus ignorieren die Temperatur-Schwellen.
          default: []
          selector:
            entity:
              domain: weather
    morning_section:
      name: Morgens öffnen
      description: |
        Einstellungen für das automatische Öffnen am Morgen.
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_enabled:
          name: Morgens öffnen aktivieren
          default: true
          selector:
            boolean: {}
        morning_time:
          name: Uhrzeit für morgendliches Hochfahren
          description: |
            Ein input_datetime-Helfer mit der Uhrzeit für das Hochfahren (erforderlich, wenn
            "Morgens öffnen" aktiviert ist). Wichtig: einen Helfer, der NUR eine Uhrzeit enthält
            (ohne Datum) — ein Datum+Uhrzeit-Helfer feuert nur ein einziges Mal an genau diesem
            Datum und danach nie wieder. In allen Blueprint-Instanzen denselben Helfer auswählen.
          default: []
          selector:
            entity:
              domain: input_datetime
        morning_position:
          name: Zielposition für morgens
          description: |
            Die Position (in %), auf die der Rollladen morgens fährt. Es wird nur gefahren, wenn der
            Rollladen geschlossener ist als diese Position.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
    window_interaction_section:
      name: Fenster-Interaktion
      description: |
        Wie der Rollladen auf ein geöffnetes Fenster reagiert.
      icon: mdi:window-open-variant
      collapsed: true
      input:
        window_open_position:
          name: Zielposition bei geöffnetem Fenster
          description: |
            Die Position (in %), auf die der Rollladen fährt, sobald das Fenster geöffnet (bzw.
            gekippt) wird — tagsüber und außerhalb des Nachtmodus. Es wird nur gefahren, wenn der
            Rollladen geschlossener ist als diese Position. 100 % würde den Rollladen komplett
            hochfahren.
          default: 35
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        reclose_timeout:
          name: Zeitfenster für automatisches Zurückfahren
          description: |
            Wird das Fenster innerhalb dieser Zeit wieder geschlossen, fährt der Rollladen in seine
            Ausgangsposition zurück.
          default: 30
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        force_close:
          name: Schließen erzwingen
          description: |
            Wenn aktiviert, wird der Rollladen nach Ablauf des Zeitfensters immer geschlossen, auch
            wenn das Fenster noch offen ist. ⚠️ Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    window_geometry_section:
      name: Fenstergeometrie & Sonnenausrichtung
      description: |
        Ausrichtung und Sichtfeld des Fensters. Diese Werte bestimmen, wann die Sonne
        geometrisch "ins Fenster scheint" — sowohl für den Sonnenschutz (Beschattung) als auch
        für Sonnenheizen. Wird nur eines der beiden Features genutzt, müssen die Werte trotzdem
        hier gesetzt werden.

        Zur Bedeutung von Ausrichtung und Sichtfeld: ![Erklärgrafik
        Sichtfeld](https://cdn.jsdelivr.net/gh/TheRealSimon42/ha-blueprints@main/images/sichtfeld_beschattung.svg)
      icon: mdi:sun-compass
      collapsed: true
      input:
        window_azimuth:
          name: Ausrichtung des Fensters
          description: |
            Himmelsrichtung, in die das Fenster zeigt, in Grad (0 = Nord, 90 = Ost, 180 = Süd, 270 =
            West).
          default: 180
          selector:
            number:
              min: 0
              max: 359
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_left:
          name: Sichtfeld links
          description: |
            Wie weit die Sonne seitlich links von der Fensterausrichtung stehen darf und noch als
            "scheint ins Fenster" gilt. 90° ist das geometrische Maximum — die Sonne steht dann
            genau in der Fassadenebene und kann das Fenster gerade noch treffen. Nur verkleinern,
            wenn auf dieser Seite ein Hindernis die Sonne blockiert (tiefe Laibung, Balkon,
            Nachbarhaus). Links/rechts gilt von innen am Fenster stehend mit Blick nach draußen —
            bei einem Südfenster ist links die Vormittagsseite (Osten).
          default: 60
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_right:
          name: Sichtfeld rechts
          description: |
            Wie Sichtfeld links, nur rechts der Fensterausrichtung — bei einem Südfenster die
            Nachmittags-/Abendseite (Westen).
          default: 60
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_min_elevation:
          name: Minimale Sonnenhöhe
          description: |
            Unterhalb dieser Sonnenhöhe (Elevation in Grad) gilt die Sonne als nicht "im Fenster"
            (weder für Sonnenschutz noch für Sonnenheizen), z.B. weil Nachbargebäude oder Bäume die
            tiefe Sonne ohnehin blockieren.
          default: 0
          selector:
            number:
              min: 0
              max: 45
              step: 1
              mode: slider
              unit_of_measurement: °
    shading_section:
      name: Sonnenschutz (Beschattung)
      description: |
        Fährt den Rollladen anhand des Sonnenstands automatisch so weit herunter, dass die Sonne
        höchstens bis zur eingestellten Tiefe in den Raum scheint — und wieder hoch, sobald die
        Sonne nicht mehr ins Fenster scheint oder es abgekühlt ist. Sehr schräg einfallende
        Sonne wird dabei automatisch berücksichtigt: je flacher der Winkel, desto weiter oben
        bleibt der Rollladen. Wird der Rollladen während der Beschattung manuell verfahren,
        erkennt die Automation das und lässt ihn bis zum Beschattungs-Ende in Ruhe. Ausrichtung
        und Sichtfeld werden im Abschnitt "Fenstergeometrie & Sonnenausrichtung" eingestellt. ⚠️
        Benötigt einen eigenen input_boolean-Helfer pro Fenster als Status-Speicher.
      icon: mdi:sun-wireless
      collapsed: true
      input:
        shading_enabled:
          name: Sonnenschutz aktivieren
          description: |
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im Abschnitt
            "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer, erinnert eine dauerhafte
            Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        shading_status_helper:
          name: Status-Helfer (input_boolean)
          description: |
            Erforderlich für den Sonnenschutz: ein input_boolean-Helfer NUR für dieses Fenster. Er
            merkt sich, ob die Beschattung aktiv ist, damit der Rollladen danach zuverlässig wieder
            geöffnet wird (auch über Neustarts hinweg).
          default: []
          selector:
            entity:
              domain: input_boolean
        shading_weather_states:
          name: Wetterlagen für Beschattung (optional)
          description: |
            Beschattet wird nur, wenn die Wetter-Entität (siehe Abschnitt "Wetter") eine dieser
            Wetterlagen meldet — praktisch, um z.B. bei "bewölkt" trotz rechnerisch passendem
            Sonnenstand nicht unnötig zu beschatten. Leer lassen, um die Wetterlage zu ignorieren
            (Standardverhalten wie bisher — nur Sonnenstand und Temperatur zählen). Ohne gesetzte
            Wetter-Entität wird dieser Filter ignoriert, auch wenn hier Werte ausgewählt sind.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
                - value: sunny
                  label: ☀️ Sonnig
                - value: partlycloudy
                  label: ⛅ Teilweise bewölkt
                - value: cloudy
                  label: ☁️ Bewölkt
                - value: clear-night
                  label: 🌙 Klare Nacht
                - value: fog
                  label: 🌫️ Nebel
                - value: windy
                  label: 💨 Windig
                - value: windy-variant
                  label: 💨 Windig mit Wolken
                - value: rainy
                  label: 🌧️ Regnerisch
                - value: pouring
                  label: 🌧️ Starkregen
                - value: lightning
                  label: ⛈️ Gewitter
                - value: lightning-rainy
                  label: ⛈️ Gewitter mit Regen
                - value: hail
                  label: 🌨️ Hagel
                - value: snowy
                  label: ❄️ Schnee
                - value: snowy-rainy
                  label: 🌨️ Schneeregen
                - value: exceptional
                  label: ⚠️ Außergewöhnlich
        window_height:
          name: Fensterhöhe
          description: |
            Höhe der Glasfläche in Metern.
          default: 1
          selector:
            number:
              min: 0.3
              max: 3.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        window_sill_height:
          name: Brüstungshöhe
          description: |
            Höhe der Fensterunterkante über dem Fußboden in Metern (bei bodentiefen Fenstern 0).
          default: 1
          selector:
            number:
              min: 0
              max: 2.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        shading_depth:
          name: Maximale Sonneneinfall-Tiefe
          description: |
            Wie weit die Sonne maximal in den Raum scheinen darf (auf dem Fußboden gemessen, ab
            Fensterebene). Kleinere Werte = strengere Beschattung; bei sehr kleinen Werten fährt der
            Rollladen praktisch komplett zu.
          default: 0.4
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              mode: box
              unit_of_measurement: m
        glass_bottom_position:
          name: Aufsetz-Punkt (Glas-Kalibrierung)
          description: |
            Die Position (in %), bei der der Panzer gerade auf Fensterbank oder Boden aufsitzt und
            das Glas komplett abgedeckt ist — darunter schließen sich nur noch die Lamellen. Zum
            Ermitteln den Rollladen langsam herunterfahren, bis der Lichtspalt unten gerade
            verschwindet, und die Position ablesen. Mit gesetztem Wert rechnet die Beschattung in
            echter Glasfläche und fährt nie tiefer als diesen Punkt — die Lamellen bleiben offen. 0
            = Motor-Position wird direkt als Glasfläche interpretiert (bisheriges Verhalten).
          default: 15
          selector:
            number:
              min: 0
              max: 50
              step: 1
              mode: slider
              unit_of_measurement: '%'
        glass_top_position:
          name: Oberer Glas-Endpunkt (Glas-Kalibrierung)
          description: |
            Die Position (in %), bei der das Glas gerade komplett frei ist — darüber wird der Panzer
            nur noch in den Kasten eingezogen. Meist nahe 100 und deutlich unwichtiger als der
            Aufsetz-Punkt. Muss über dem Aufsetz-Punkt liegen, sonst wird die Kalibrierung
            ignoriert.
          default: 100
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        shading_min_position:
          name: Minimale Beschattungsposition
          description: |
            Tiefer als diese Position fährt die Beschattung nicht (z.B. 10 %, damit immer etwas
            Tageslicht bleibt). 0 = ganz schließen erlaubt. Dient bei aktivierter "Beschattung
            erzwingen" außerdem als Mindest-Lüftungsspalt, wenn das Fenster offen ist.
          default: 25
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        shading_end_position:
          name: Position nach der Beschattung
          description: |
            Position, auf die nach Ende der Beschattung gefahren wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        shading_temp_sensor:
          name: Tageshöchsttemperatur-Sensor (optional)
          description: Optionaler Sensor für die erwartete Tageshöchsttemperatur, gemeinsam für Sonnenschutz
            und Sonnenheizen. Ohne Sensor wird die heutige Tageshöchsttemperatur aus der Wettervorhersage
            verwendet. Ein aktueller Außentemperatur-Sensor ist hierfür nicht geeignet.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
        shading_temp_threshold:
          name: Temperatur-Schwelle
          description: |
            Beschattet wird nur, wenn die geprüfte Temperatur (eigener Sensor bzw. maximale
            Tagestemperatur laut Vorhersage) über diesem Wert liegt.
          default: 23
          selector:
            number:
              min: 10
              max: 40
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_temp_hysteresis:
          name: Temperatur-Hysterese
          description: Eine aktive Beschattung führt innerhalb der Hysterese weiter nach. Sie endet
            temperaturbedingt erst bei oder unter Schwelle minus Hysterese. Ohne gültige Temperatur wird die
            Position gehalten, sofern kein anderer Beendigungsgrund vorliegt.
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_min_change:
          name: Minimale Positionsänderung
          description: |
            Der Rollladen wird beim Nachführen nur bewegt, wenn sich die Zielposition um mindestens
            diesen Wert von der aktuellen unterscheidet (schont den Motor).
          default: 8
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: '%'
        shading_override_threshold:
          name: Toleranz für manuelle Eingriffe
          description: |
            Weicht die Ist-Position während laufender Beschattung um mehr als diesen Wert von der
            berechneten Sollposition ab, wertet die Automation das als manuellen Eingriff und lässt
            den Rollladen in Ruhe — bis die Beschattung endet und normal wieder geöffnet wird.
            Kleinere Abweichungen gelten als normales Nachführen der Sonne.
          default: 20
          selector:
            number:
              min: 10
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: '%'
        force_shading:
          name: Beschattung erzwingen
          description: |
            Wenn aktiviert, wird auch bei geöffnetem Fenster beschattet — praktisch, damit es nicht
            aufheizt, wenn man das Fenster mal vergisst. Als Lüftungsspalt bleibt dabei mindestens
            die "Minimale Beschattungsposition" stehen. ⚠️ Achtung: Für Balkon- und Terrassentüren
            nicht empfohlen — Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    solar_heating_section:
      name: Sonnenheizen (Winter)
      description: |
        Das Gegenteil des Sonnenschutzes: Öffnet einen heruntergelassenen (z.B. vergessenen)
        Rollladen automatisch, wenn die Sonne laut Sonnenstand ins Fenster scheint und eine
        niedrige Tageshöchsttemperatur erwartet wird — damit die Sonne kostenlos beim Aufheizen des Raums hilft. Nutzt
        dieselbe Fensterausrichtung/Sichtfeld wie der Sonnenschutz (Abschnitt "Fenstergeometrie
        & Sonnenausrichtung"), läuft aber unabhängig davon, ob der Sonnenschutz selbst aktiviert
        ist. Der Sturmschutz hat immer Vorrang — bei Starkwind greift Sonnenheizen nicht. ⚠️
        Benötigt einen EIGENEN input_boolean-Helfer (nicht denselben wie der
        Sonnenschutz-Helfer!).
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        solar_heating_enabled:
          name: Sonnenheizen aktivieren
          description: |
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im Abschnitt
            "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer, erinnert eine dauerhafte
            Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        solar_heating_status_helper:
          name: Status-Helfer (input_boolean)
          description: |
            Erforderlich für Sonnenheizen: ein eigener input_boolean-Helfer NUR für dieses Fenster
            (separat vom Sonnenschutz-Helfer). Verhindert, dass ein manuell wieder
            heruntergelassener Rollladen im selben Zeitraum erneut aufgedrängt wird — erst wenn die
            Bedingungen (Sonne/Temperatur) einmal enden und neu eintreten, öffnet Sonnenheizen
            wieder.
          default: []
          selector:
            entity:
              domain: input_boolean
        solar_heating_temp_threshold:
          name: Temperatur-Schwelle
          description: Sonnenheizen greift nur, wenn die erwartete Tageshöchsttemperatur höchstens diesem Wert
            entspricht. Nutzt denselben Tageshöchsttemperatur-Sensor bzw. dieselbe Tagesvorhersage wie der
            Sonnenschutz. Ohne gültige Höchsttemperatur beginnt kein Sonnenheizen.
          default: 12
          selector:
            number:
              min: -10
              max: 20
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_temp_hysteresis:
          name: Temperatur-Hysterese
          description: |
            Sonnenheizen endet erst, wenn die Temperatur um diesen Wert über die Schwelle gestiegen
            ist (verhindert ständiges Auf und Ab).
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_min_position:
          name: Grenzwert "heruntergelassen"
          description: |
            Der Rollladen gilt erst unterhalb dieser Position als "heruntergelassen" und wird nur
            dann durch Sonnenheizen geöffnet (verhindert unnötiges Nachfahren bei einem bereits fast
            offenen Rollladen).
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        solar_heating_position:
          name: Zielposition
          description: |
            Position (in %), auf die der Rollladen beim Sonnenheizen geöffnet wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
    evening_night_section:
      name: Abend- und Nachtmodus
      description: |
        Zwei unabhängige Wege, den Rollladen für die Nacht zu fahren — jeweils mit eigener
        Temperatur-Schwelle und frei einstellbarer Zielposition. Beide prüfen dabei NICHT die
        aktuelle Temperatur, sondern die laut Wettervorhersage der Wetter-Entität (Abschnitt
        "Wetter") erwartete MINIMALE Tagestemperatur:

        Abendmodus (automatisch): schließt zu einer festen Uhrzeit ODER zum
        Sonnenuntergang+Offset — beide Zeitpunkte prüfen die Temperatur erneut; gefahren wird
        nur, wenn die minimale Tagestemperatur höchstens der Schwelle entspricht. Reagiert nur
        bei geschlossenem Fenster und nur, solange der Nachtmodus noch nicht aktiv ist.

        Nachtmodus (manuell): wird per gemeinsamem Helfer eingeschaltet und fährt dann auf seine
        Zielposition, sofern die minimale Tagestemperatur die Schwelle unterschreitet — sonst
        bleibt der Rollladen stehen (eine laufende Beschattung wird trotzdem beendet).

        Der Abendmodus ist eine einmalige Fahrt ohne eigenen Status-Helfer. Bei offenem Fenster
        entfällt die Fahrt. Nachtmodus und morgendliches Öffnen übernehmen über ihre eigenen
        Auslöser.
      icon: mdi:weather-night
      collapsed: true
      input:
        evening_enabled:
          name: Abendmodus aktivieren
          default: false
          selector:
            boolean: {}
        evening_time:
          name: Feste Uhrzeit für den Abendmodus (optional)
          description: |
            Ein input_datetime-Helfer NUR mit Uhrzeit (ohne Datum). Leer lassen, um nur über
            Sonnenuntergang+Offset auszulösen. In allen Blueprint-Instanzen denselben Helfer
            auswählen.
          default: []
          selector:
            entity:
              domain: input_datetime
        evening_sunset_offset:
          name: Offset zum Sonnenuntergang
          description: |
            Löst den Abendmodus zusätzlich zur festen Uhrzeit relativ zum Sonnenuntergang aus (z.B.
            01:00:00 = eine Stunde nach Sonnenuntergang). Negative Werte lösen vor dem
            Sonnenuntergang aus.
          default:
            hours: 0
            minutes: 30
          selector:
            duration:
              enable_second: true
              allow_negative: true
        evening_temp_threshold:
          name: Temperatur-Schwelle für den Abendmodus ("nur bei Kälte")
          description: |
            Der Abendmodus schließt nur, wenn die laut Wettervorhersage der Wetter-Entität
            (Abschnitt "Wetter") für heute erwartete MINIMALE Tagestemperatur unter diesem Wert
            liegt — nicht die aktuelle Temperatur. Ohne gesetzte Wetter-Entität oder ohne verfügbare
            Vorhersage wird der Abendmodus wie gehabt ausgelöst (kein Blockieren durch fehlende
            Daten).
          default: 15
          selector:
            number:
              min: -10
              max: 30
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        evening_position:
          name: Zielposition für den Abendmodus
          description: |
            Position (in %), auf die der Rollladen im Abendmodus fährt.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        night_mode_boolean:
          name: Nachtmodus-Helfer (optional)
          description: |
            Ein input_boolean-Helfer. Wird er eingeschaltet, fährt der Rollladen für die Nacht auf
            die "Zielposition für den Nachtmodus" (bzw. bei offenem Fenster auf die Nachtposition
            weiter unten) — sofern die Temperatur-Schwelle unterschritten ist. Leer lassen, wenn
            kein Nachtmodus gewünscht ist. In allen Blueprint-Instanzen denselben Helfer auswählen.
          default: []
          selector:
            entity:
              domain: input_boolean
        night_temp_threshold:
          name: Temperatur-Schwelle für den Nachtmodus ("nur bei Kälte")
          description: |
            Der Nachtmodus fährt den Rollladen nur, wenn die laut Wettervorhersage der
            Wetter-Entität (Abschnitt "Wetter") für heute erwartete MINIMALE Tagestemperatur unter
            diesem Wert liegt — nicht die aktuelle Temperatur. Ohne gesetzte Wetter-Entität oder
            ohne verfügbare Vorhersage wird der Nachtmodus wie gehabt immer ausgeführt (kein
            Blockieren durch fehlende Daten). Eine laufende Beschattung wird unabhängig davon immer
            beendet.
          default: 15
          selector:
            number:
              min: -10
              max: 30
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        night_closed_position:
          name: Zielposition für den Nachtmodus
          description: |
            Position (in %), auf die der Rollladen fährt, wenn der Nachtmodus-Helfer eingeschaltet
            wird und das Fenster geschlossen ist.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
        night_ventilation_position:
          name: Nachtposition bei offenem Fenster
          description: |
            Position (in %), auf die nachts (Nachtmodus-Helfer aktiv) gefahren wird, solange das
            Fenster offen ist.
          default: 10
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
    storm_protection_section:
      name: Sturmschutz
      description: |
        Fährt den Rollladen bei starkem Wind hoch (oder im Panzer-Modus herunter). Die
        Wetter-Entität dafür wird im Abschnitt "Wetter" oben eingestellt.
      icon: mdi:weather-windy
      collapsed: true
      input:
        storm_enabled:
          name: Sturmschutz aktivieren
          description: |
            Benötigt eine Wetter-Entität (Abschnitt "Wetter") oder einen Wind-Sensor (unten
            auswählen).
          default: false
          selector:
            boolean: {}
        storm_wind_sensor:
          name: Wind-Sensor (optional)
          description: |
            Alternativ zur Wetter-Entität: ein Sensor mit Windgeschwindigkeit, z.B. der Böen-Sensor
            deiner Wetterstation (Böen sind für den Sturmschutz meist aussagekräftiger als der
            Mittelwind). Wenn gesetzt, hat er Vorrang vor der Wetter-Entität.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: wind_speed
        wind_speed_threshold:
          name: Windgeschwindigkeit-Grenzwert
          description: |
            Ab dieser Windgeschwindigkeit wird der Sturmschutz ausgelöst (ca. 55 km/h empfohlen).
            Wichtig: Der Wert wird direkt mit dem Sensorwert bzw. dem wind_speed-Attribut der
            Wetter-Entität verglichen — liefert deine Quelle m/s oder mph statt km/h, muss der
            Grenzwert entsprechend umgerechnet werden.
          default: 55
          selector:
            number:
              min: 30
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: km/h
        panzer_mode:
          name: Panzer-Modus
          description: |
            Wenn aktiviert, wird der Rollladen bei Sturm geschlossen statt geöffnet.
          default: false
          selector:
            boolean: {}
        force_storm_action:
          name: Aktion bei Sturm erzwingen
          description: |
            Wenn aktiviert, wird der Rollladen bei Sturm auch bewegt, wenn das Fenster offen ist. ⚠️
            Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    pause_section:
      name: Pausieren
      description: |
        Hält die Automation vorübergehend komplett an — z.B. während einer Videoaufnahme
        (Licht!), wenn Gäste im Zimmer schlafen oder der Fensterputzer da ist.
      icon: mdi:pause-circle
      collapsed: true
      input:
        pause_boolean:
          name: Pausier-Helfer (optional)
          description: |
            Ein oder mehrere input_boolean-Helfer, die die Automatik anhalten — keine Fahrten, keine
            Meldungen. Ob dafür der ein- oder ausgeschaltete Zustand zählt, legst du im nächsten
            Feld fest; bei mehreren Helfern pausiert die Automatik nur, wenn ALLE gleichzeitig im
            Pausier-Zustand sind. Zwei Ausnahmen: Der Sturmschutz greift weiterhin (Hardware-Schutz
            geht vor), und der "Rollladen schließen"-Knopf einer Benachrichtigung funktioniert wie
            der Wandtaster — bewusste Befehle werden nicht blockiert. Beim Ende der Pause wird ein
            inzwischen aktiver Nachtmodus nachgeholt und die Beschattung neu bewertet; verpasste
            Einzelereignisse (z.B. das morgendliche Öffnen, der Abendmodus oder das Zurückfahren
            nach dem Lüften) werden nicht nachgeholt.
          default: []
          selector:
            entity:
              domain: input_boolean
              multiple: true
        pause_mode:
          name: Logik des Pausier-Helfers
          description: |
            Gilt für alle ausgewählten Pausier-Helfer gemeinsam. "AN pausiert" passt zu Helfern wie
            "Aufnahme läuft" — pausiert wird, wenn alle eingeschaltet sind. "AUS pausiert" macht die
            Helfer zu Aktiv-Schaltern fürs Dashboard (z.B. "Rollladensteuerung aktiv") — pausiert
            wird, wenn alle ausgeschaltet sind; sobald einer an ist, läuft die Automatik.
          default: on_pauses
          selector:
            select:
              mode: list
              options:
                - value: on_pauses
                  label: Helfer AN = Automatik pausiert (z.B. "Aufnahme läuft")
                - value: off_pauses
                  label: Helfer AUS = Automatik pausiert (z.B. "Rollladensteuerung aktiv")
    notification_section:
      name: Benachrichtigungen
      description: |
        Benachrichtigung bei zu lange offenem Fenster. Wird das Fenster geschlossen,
        verschwindet die Meldung automatisch vom Gerät.
      icon: mdi:bell
      collapsed: true
      input:
        notification_device:
          name: Benachrichtigungs-Geräte
          description: |
            Geräte mit der Home Assistant Companion App. Leer = keine Benachrichtigungen.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notification_timeout:
          name: Benachrichtigung nach X Min. (Fenster offen)
          default: 20
          selector:
            number:
              min: 5
              max: 240
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        use_area_name:
          name: Bereichsnamen in Benachrichtigungen verwenden
          description: |
            Wenn aktiviert, wird der Bereichsname (z.B. "Wohnzimmer") statt des Sensor-Namens
            verwendet.
          default: false
          selector:
            boolean: {}
        sleep_mode_boolean:
          name: Schlafmodus-Helfer (optional)
          description: |
            Wenn dieser input_boolean 'on' ist, werden keine Benachrichtigungen gesendet.
          default: []
          selector:
            entity:
              domain: input_boolean
mode: parallel
max: 20
variables:
  cover_entity: !input 'cover'
  window_sensor: !input 'window_sensor'
  window_open_position: !input 'window_open_position'
  reclose_timeout: !input 'reclose_timeout'
  force_close: !input 'force_close'
  morning_position: !input 'morning_position'
  evening_enabled: !input 'evening_enabled'
  evening_temp_threshold: !input 'evening_temp_threshold'
  evening_position: !input 'evening_position'
  night_mode_boolean: !input 'night_mode_boolean'
  night_temp_threshold: !input 'night_temp_threshold'
  night_closed_position: !input 'night_closed_position'
  night_ventilation_position: !input 'night_ventilation_position'
  storm_enabled: !input 'storm_enabled'
  weather_entity: !input 'weather_entity'
  storm_wind_sensor: !input 'storm_wind_sensor'
  wind_speed_threshold: !input 'wind_speed_threshold'
  panzer_mode: !input 'panzer_mode'
  force_storm_action: !input 'force_storm_action'
  shading_status_helper: !input 'shading_status_helper'
  window_azimuth: !input 'window_azimuth'
  shading_fov_left: !input 'shading_fov_left'
  shading_fov_right: !input 'shading_fov_right'
  shading_min_elevation: !input 'shading_min_elevation'
  window_height: !input 'window_height'
  window_sill_height: !input 'window_sill_height'
  shading_depth: !input 'shading_depth'
  glass_bottom_position: !input 'glass_bottom_position'
  glass_top_position: !input 'glass_top_position'
  shading_min_position: !input 'shading_min_position'
  shading_end_position: !input 'shading_end_position'
  shading_temp_sensor: !input 'shading_temp_sensor'
  shading_temp_threshold: !input 'shading_temp_threshold'
  shading_temp_hysteresis: !input 'shading_temp_hysteresis'
  shading_min_change: !input 'shading_min_change'
  shading_override_threshold: !input 'shading_override_threshold'
  force_shading: !input 'force_shading'
  shading_weather_states: !input 'shading_weather_states'
  solar_heating_status_helper: !input 'solar_heating_status_helper'
  solar_heating_temp_threshold: !input 'solar_heating_temp_threshold'
  solar_heating_temp_hysteresis: !input 'solar_heating_temp_hysteresis'
  solar_heating_min_position: !input 'solar_heating_min_position'
  solar_heating_position: !input 'solar_heating_position'
  pause_boolean: !input 'pause_boolean'
  pause_mode: !input 'pause_mode'
  pause_active: |-
    {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %} {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %} {% set found = expand(helpers) | list %} {{ helpers | length > 0
       and found | length > 0
       and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
  sleep_mode_boolean: !input 'sleep_mode_boolean'
  use_area_name: !input 'use_area_name'
  notification_timeout: !input 'notification_timeout'
  notification_device: !input 'notification_device'
  action_id: '{{ ''CLOSE_SHUTTER__'' ~ window_sensor }}'
  notification_tag: '{{ ''fenster_offen_'' ~ (window_sensor | slugify) }}'
  device_name_map: |
    {% set ns = namespace(device_names=[]) %} {% for device_id in notification_device %}
      {% set device_name = device_attr(device_id, "name") %}
      {% if device_name %}
        {% set ns.device_names = ns.device_names + ["mobile_app_" + device_name | slugify] %}
      {% endif %}
    {% endfor %} {{ ns.device_names }}
  shading_enabled: !input 'shading_enabled'
  daily_forecast: {}
  today_forecast: {}
  daily_high:
  daily_low:
  night_temp_ok: true
  evening_temp_ok: true
  solar_heating_enabled: !input 'solar_heating_enabled'
trigger_variables:
  window_sensor_tv: !input 'window_sensor'
  shading_enabled_tv: !input 'shading_enabled'
  solar_heating_enabled_tv: !input 'solar_heating_enabled'
triggers:
  - trigger: time
    at: !input 'morning_time'
    id: morning_open
    enabled: !input 'morning_enabled'
  - trigger: state
    entity_id: !input 'window_sensor'
    to:
      - 'on'
      - open
    for:
      seconds: 2
    id: window_change
  - trigger: state
    entity_id: !input 'window_sensor'
    to:
      - 'on'
      - open
    for:
      minutes: !input 'notification_timeout'
    id: window_open_long
  - trigger: state
    entity_id: !input 'window_sensor'
    to:
      - 'off'
      - closed
    for:
      seconds: 2
    id: window_closed
  - trigger: state
    entity_id: !input 'pause_boolean'
    from: 'on'
    to: 'off'
    id: pause_ended
  - trigger: state
    entity_id: !input 'pause_boolean'
    from: 'off'
    to: 'on'
    id: pause_ended
  - trigger: state
    entity_id: !input 'night_mode_boolean'
    to: 'on'
    id: night_close
  - trigger: time
    at: !input 'evening_time'
    id: evening_close
    enabled: !input 'evening_enabled'
  - trigger: sun
    event: sunset
    offset: !input 'evening_sunset_offset'
    id: evening_close
    enabled: !input 'evening_enabled'
  - trigger: numeric_state
    entity_id: !input 'weather_entity'
    attribute: wind_speed
    above: !input 'wind_speed_threshold'
    id: storm_detected
    enabled: !input 'storm_enabled'
  - trigger: numeric_state
    entity_id: !input 'storm_wind_sensor'
    above: !input 'wind_speed_threshold'
    id: storm_detected
    enabled: !input 'storm_enabled'
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: CLOSE_SHUTTER__{{ window_sensor_tv }}
    id: close_shutter_action
  - trigger: time_pattern
    minutes: /5
    id: solar_tick
    enabled: '{{ shading_enabled_tv or solar_heating_enabled_tv }}'
actions:
  - condition: |-
      {{ trigger.id | default('') in ['storm_detected', 'window_closed', 'close_shutter_action']
         or not pause_active }}
  - choose:
      - conditions:
          - condition: trigger
            id: morning_open
        sequence:
          - variables:
              wind_now: |-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - condition: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
          - choose:
              - conditions:
                  - '{{ state_attr(cover_entity, ''current_position'') is not none }}'
                  - '{{ state_attr(cover_entity, ''current_position'') | int(101) < morning_position }}'
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input 'cover'
                    data:
                      position: !input 'morning_position'
              - conditions:
                  - '{{ state_attr(cover_entity, ''current_position'') is none }}'
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input 'cover'
          - if:
              - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ shading_status_helper }}'
      - conditions:
          - condition: trigger
            id: evening_close
        sequence:
          - &refresh_daily_forecast
            alias: Tagesvorhersage aktualisieren und Temperaturen auswerten
            sequence:
              - variables:
                  daily_forecast: {}
              - if:
                  - '{{ weather_entity is string }}'
                then:
                  - action: weather.get_forecasts
                    target:
                      entity_id: '{{ weather_entity }}'
                    data:
                      type: daily
                    response_variable: daily_forecast
                    continue_on_error: true
              - variables:
                  today_forecast: |-
                    {% set entries = (daily_forecast.get(weather_entity, {}) or {}).get('forecast') or [] if weather_entity is string else [] %}
                    {% set result = namespace(entry={}) %}
                    {% for entry in entries %}
                      {% set dt = as_datetime(entry.get('datetime'), none) %}
                      {% if dt is not none and as_local(dt).date() == now().date() and not result.entry %}
                        {% set result.entry = entry %}
                      {% endif %}
                    {% endfor %}
                    {{ result.entry }}
                  daily_low: '{{ today_forecast.get(''templow'') | float(none) }}'
                  daily_high: '{{ states(shading_temp_sensor) | float(none) if shading_temp_sensor is string else
                    today_forecast.get(''temperature'') | float(none) }}'
                  night_temp_ok: '{{ daily_low is none or daily_low <= night_temp_threshold }}'
                  evening_temp_ok: '{{ daily_low is none or daily_low <= evening_temp_threshold }}'
          - variables:
              wind_now: |-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - condition: '{{ evening_temp_ok }}'
          - condition: '{{ states(window_sensor) in [''off'', ''closed''] }}'
          - condition: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
          - condition: '{{ not (night_mode_boolean is string and is_state(night_mode_boolean, ''on'')) }}'
          - condition: '{{ state_attr(cover_entity, ''current_position'') | int(-1) > evening_position }}'
          - action: cover.set_cover_position
            target:
              entity_id: !input 'cover'
            data:
              position: !input 'evening_position'
          - if:
              - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ shading_status_helper }}'
          - if:
              - '{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ solar_heating_status_helper }}'
      - conditions:
          - condition: trigger
            id: night_close
        sequence:
          - if:
              - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ shading_status_helper }}'
          - if:
              - '{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ solar_heating_status_helper }}'
          - *refresh_daily_forecast
          - condition: '{{ night_temp_ok }}'
          - variables:
              wind_now: |-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - condition: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
          - choose:
              - conditions:
                  - '{{ states(window_sensor) in [''on'', ''open''] }}'
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input 'cover'
                    data:
                      position: !input 'night_ventilation_position'
            default:
              - action: cover.set_cover_position
                target:
                  entity_id: !input 'cover'
                data:
                  position: !input 'night_closed_position'
      - conditions:
          - condition: trigger
            id: storm_detected
          - '{{ force_storm_action or states(window_sensor) in [''off'', ''closed''] }}'
        sequence:
          - if:
              - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ shading_status_helper }}'
          - if:
              - '{{ not panzer_mode }}'
            then:
              - action: cover.open_cover
                target:
                  entity_id: !input 'cover'
            else:
              - action: cover.close_cover
                target:
                  entity_id: !input 'cover'
      - conditions:
          - condition: trigger
            id: pause_ended
          - |-
            {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %} {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %} {% set ns = namespace(all = helpers | length > 0) %} {% for h in helpers %}
              {% set st = trigger.from_state.state if h == trigger.entity_id else states(h) %}
              {% if st != pausing %}{% set ns.all = false %}{% endif %}
            {% endfor %} {{ ns.all }}
        sequence:
          - if:
              - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ shading_status_helper }}'
          - variables:
              wind_now: |-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - *refresh_daily_forecast
          - if:
              - '{{ night_mode_boolean is string and is_state(night_mode_boolean, ''on'') }}'
              - '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
              - '{{ night_temp_ok }}'
            then:
              - choose:
                  - conditions:
                      - '{{ states(window_sensor) in [''on'', ''open''] }}'
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input 'cover'
                        data:
                          position: !input 'night_ventilation_position'
                default:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input 'cover'
                    data:
                      position: !input 'night_closed_position'
      - conditions:
          - condition: trigger
            id: solar_tick
        sequence:
          - variables:
              sun_elevation: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
              sun_azimuth: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
              az_diff: '{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}'
              sun_in_window: |-
                {{ sun_elevation >= shading_min_elevation
                   and az_diff >= (0 - shading_fov_left)
                   and az_diff <= shading_fov_right }}
          - if:
              - '{{ sun_in_window }}'
            then:
              - if:
                  - '{{ shading_temp_sensor is string }}'
                then:
                  - variables:
                      daily_high: '{{ states(shading_temp_sensor) | float(none) }}'
                else:
                  - *refresh_daily_forecast
          - if:
              - '{{ shading_enabled }}'
            then:
              - if:
                  - '{{ shading_status_helper is not string }}'
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: rollladen_helfer_fehlt_{{ cover_entity | slugify }}
                      title: 'Rollladensteuerung: Status-Helfer fehlt'
                      message: Der Sonnenschutz für "{{ state_attr(cover_entity, 'friendly_name') or
                        cover_entity }}" ist aktiviert, aber es ist kein Status-Helfer (input_boolean)
                        ausgewählt — die Beschattung bleibt dadurch wirkungslos. Bitte in der Automation einen
                        Helfer auswählen oder den Sonnenschutz deaktivieren.
              - condition: '{{ shading_status_helper is string }}'
              - variables:
                  outdoor_temp: '{{ daily_high | float(-99) }}'
                  wind_now: |-
                    {% if storm_wind_sensor is string %}
                      {{ states(storm_wind_sensor) | float(0) }}
                    {% elif weather_entity is string %}
                      {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                    {% else %}
                      0
                    {% endif %}
                  storm_ok: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
                  temp_available: '{{ daily_high is not none }}'
                  weather_ok: |-
                    {{ shading_weather_states | length == 0
                       or not (weather_entity is string)
                       or states(weather_entity) in ['unknown', 'unavailable']
                       or states(weather_entity) in shading_weather_states }}
                  weather_bad_stable: |-
                    {{ shading_weather_states | length > 0
                       and weather_entity is string
                       and states(weather_entity) not in ['unknown', 'unavailable']
                       and states(weather_entity) not in shading_weather_states
                       and (as_timestamp(now()) - as_timestamp(states[weather_entity].last_changed)) > 600 }}
              - choose:
                  - conditions:
                      - |-
                        {{ sun_in_window and temp_available
                           and (outdoor_temp >= shading_temp_threshold
                                or (is_state(shading_status_helper, 'on')
                                    and outdoor_temp > shading_temp_threshold - shading_temp_hysteresis)) }}
                      - '{{ storm_ok }}'
                      - '{{ weather_ok }}'
                      - '{{ not (night_mode_boolean is string and is_state(night_mode_boolean, ''on'')) }}'
                      - '{{ force_shading or states(window_sensor) not in [''on'', ''open''] }}'
                    sequence:
                      - variables:
                          ray_height: |-
                            {{ shading_depth * tan(sun_elevation * pi / 180)
                               / ([cos(az_diff * pi / 180), 0.087] | max) }}
                          target_position: '{% set glass_free = [[(ray_height - window_sill_height) / window_height
                            * 100, 0] | max, 100] | min %} {% set a = glass_bottom_position | int(0) %} {% set b
                            = glass_top_position | int(100) %} {% if b <= a %}{% set a = 0 %}{% set b = 100 %}{%
                            endif %} {% set p = (a + glass_free * (b - a) / 100) | round(0) | int %} {{ [p, shading_min_position
                            | int] | max }}'
                          current_position: '{{ state_attr(cover_entity, ''current_position'') | int(-1) }}'
                      - condition: '{{ current_position >= 0 }}'
                      - variables:
                          deviation: '{{ (current_position - target_position | int) | abs }}'
                      - if:
                          - '{{ is_state(shading_status_helper, ''on'') }}'
                        then:
                          - if:
                              - '{{ deviation >= shading_min_change and deviation <= shading_override_threshold
                                }}'
                            then:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input 'cover'
                                data:
                                  position: '{{ target_position }}'
                        else:
                          - action: input_boolean.turn_on
                            target:
                              entity_id: '{{ shading_status_helper }}'
                          - if:
                              - '{{ deviation >= shading_min_change }}'
                            then:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input 'cover'
                                data:
                                  position: '{{ target_position }}'
                  - conditions:
                      - '{{ is_state(shading_status_helper, ''on'') }}'
                      - |-
                        {{ (not sun_in_window)
                           or (temp_available and outdoor_temp <= (shading_temp_threshold - shading_temp_hysteresis))
                           or weather_bad_stable }}
                      - '{{ not (night_mode_boolean is string and is_state(night_mode_boolean, ''on'')) }}'
                    sequence:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: '{{ shading_status_helper }}'
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input 'cover'
                        data:
                          position: !input 'shading_end_position'
          - if:
              - '{{ solar_heating_enabled }}'
            then:
              - if:
                  - '{{ solar_heating_status_helper is not string }}'
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: rollladen_heizhelfer_fehlt_{{ cover_entity | slugify }}
                      title: 'Rollladensteuerung: Status-Helfer fehlt'
                      message: Sonnenheizen für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity
                        }}" ist aktiviert, aber es ist kein eigener Status-Helfer (input_boolean) ausgewählt —
                        das Feature bleibt dadurch wirkungslos. Bitte in der Automation einen Helfer auswählen
                        oder Sonnenheizen deaktivieren.
              - condition: '{{ solar_heating_status_helper is string }}'
              - variables:
                  outdoor_temp: '{{ daily_high | float(99) }}'
                  temp_available: '{{ daily_high is not none }}'
                  night_mode_on: '{{ night_mode_boolean is string and is_state(night_mode_boolean, ''on'') }}'
                  wind_now: |-
                    {% if storm_wind_sensor is string %}
                      {{ states(storm_wind_sensor) | float(0) }}
                    {% elif weather_entity is string %}
                      {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                    {% else %}
                      0
                    {% endif %}
                  storm_ok: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
                  shading_temperature: '{{ daily_high | float(-99) }}'
                  shading_weather_ok: |-
                    {{ shading_weather_states | length == 0
                       or not (weather_entity is string)
                       or states(weather_entity) in ['unknown', 'unavailable']
                       or states(weather_entity) in shading_weather_states }}
                  shading_priority: |-
                    {{ shading_enabled and shading_status_helper is string
                       and (is_state(shading_status_helper, 'on')
                            or (sun_in_window and shading_temperature >= shading_temp_threshold
                                and shading_weather_ok
                                and (force_shading or states(window_sensor) not in ['on', 'open']))) }}
              - choose:
                  - conditions:
                      - '{{ not is_state(solar_heating_status_helper, ''on'') }}'
                      - '{{ sun_in_window and outdoor_temp <= solar_heating_temp_threshold }}'
                      - '{{ not night_mode_on }}'
                      - '{{ storm_ok }}'
                      - |-
                        {{ state_attr(cover_entity, 'current_position') is not none
                           and state_attr(cover_entity, 'current_position') | int(101) < solar_heating_min_position }}
                      - '{{ not shading_priority }}'
                      - '{{ state_attr(cover_entity, ''current_position'') | int(101) < solar_heating_position }}'
                    sequence:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: '{{ solar_heating_status_helper }}'
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input 'cover'
                        data:
                          position: !input 'solar_heating_position'
                  - conditions:
                      - '{{ is_state(solar_heating_status_helper, ''on'') }}'
                      - |-
                        {{ (not sun_in_window)
                           or (temp_available and outdoor_temp >= (solar_heating_temp_threshold + solar_heating_temp_hysteresis))
                           or night_mode_on or shading_priority }}
                    sequence:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: '{{ solar_heating_status_helper }}'
      - conditions:
          - condition: trigger
            id: window_open_long
          - '{{ not (sleep_mode_boolean is string and is_state(sleep_mode_boolean, ''on'')) }}'
          - '{{ device_name_map | length > 0 }}'
        sequence:
          - variables:
              has_area: '{{ use_area_name and area_name(window_sensor) is not none }}'
              window_label: |-
                {%- if has_area -%}
                  {{ area_name(window_sensor) }}
                {%- else -%}
                  {{ state_attr(window_sensor, 'friendly_name') or window_sensor }}
                {%- endif -%}
              title_text: |-
                {%- if has_area -%}
                  Fenster offen in {{ window_label }}
                {%- else -%}
                  Fenster offen
                {%- endif -%}
              message_text: |-
                {%- if has_area -%}
                  Das Fenster im Bereich '{{ window_label }}' ist seit über {{ notification_timeout }} Minuten offen.
                {%- else -%}
                  Fenster '{{ window_label }}' ist seit über {{ notification_timeout }} Minuten offen.
                {%- endif -%}
          - repeat:
              for_each: '{{ device_name_map }}'
              sequence:
                - action: notify.{{ repeat.item }}
                  continue_on_error: true
                  data:
                    title: '{{ title_text }}'
                    message: '{{ message_text }}'
                    data:
                      tag: '{{ notification_tag }}'
                      actions:
                        - action: '{{ action_id }}'
                          title: Rollladen schließen
      - conditions:
          - condition: trigger
            id: window_closed
          - '{{ device_name_map | length > 0 }}'
        sequence:
          - repeat:
              for_each: '{{ device_name_map }}'
              sequence:
                - action: notify.{{ repeat.item }}
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: '{{ notification_tag }}'
      - conditions:
          - condition: trigger
            id: close_shutter_action
          - '{{ trigger.event.data.action == action_id }}'
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input 'cover'
      - conditions:
          - condition: trigger
            id: window_change
        sequence:
          - variables:
              night_mode_on: '{{ night_mode_boolean is string and is_state(night_mode_boolean, ''on'') }}'
              reclose_scene: scene.reclose_{{ cover_entity | slugify }}
          - if:
              - '{{ night_mode_on }}'
            then:
              - *refresh_daily_forecast
          - condition: '{{ states(window_sensor) in ["on", "open"] }}'
          - if:
              - |-
                {{ trigger.from_state is not none
                   and (trigger.from_state.state in ['off', 'closed']
                        or (trigger.from_state.state in ['unavailable', 'unknown']
                            and expand(reclose_scene) | count == 0)) }}
            then:
              - action: scene.create
                data:
                  scene_id: '{{ ''reclose_'' ~ (cover_entity | slugify) }}'
                  snapshot_entities:
                    - '{{ cover_entity }}'
          - choose:
              - conditions:
                  - '{{ not night_mode_on or not night_temp_ok }}'
                  - '{{ state_attr(cover_entity, ''current_position'') | int(101) < window_open_position }}'
                  - '{{ not (force_shading and shading_status_helper is string and is_state(shading_status_helper,
                    ''on'')) }}'
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input 'cover'
                    data:
                      position: !input 'window_open_position'
                  - if:
                      - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: '{{ shading_status_helper }}'
              - conditions:
                  - '{{ night_mode_on }}'
                  - '{{ state_attr(cover_entity, ''current_position'') | int(101) < night_ventilation_position }}'
                  - '{{ night_temp_ok }}'
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input 'cover'
                    data:
                      position: !input 'night_ventilation_position'
          - wait_for_trigger:
              - trigger: state
                entity_id: !input 'window_sensor'
                to:
                  - 'off'
                  - closed
                for:
                  seconds: 2
            timeout:
              minutes: !input 'reclose_timeout'
            continue_on_timeout: true
          - *refresh_daily_forecast
          - variables:
              night_mode_on_now: '{{ night_mode_boolean is string and is_state(night_mode_boolean, ''on'') }}'
              pause_now: |-
                {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %} {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %} {% set found = expand(helpers) | list %} {{ helpers | length > 0
                   and found | length > 0
                   and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
              wind_now: |-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_now: '{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}'
          - if:
              - '{{ wait.trigger is none }}'
            then:
              - if:
                  - '{{ force_close }}'
                  - '{{ not pause_now }}'
                  - '{{ not storm_now }}'
                then:
                  - action: cover.close_cover
                    target:
                      entity_id: !input 'cover'
            else:
              - choose:
                  - conditions:
                      - '{{ night_mode_on_now }}'
                      - '{{ not pause_now }}'
                      - '{{ night_temp_ok }}'
                      - '{{ not storm_now }}'
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input 'cover'
                        data:
                          position: !input 'night_closed_position'
                  - conditions:
                      - '{{ not storm_now }}'
                      - '{{ not pause_now }}'
                      - '{{ expand(reclose_scene) | count > 0 }}'
                    sequence:
                      - action: scene.turn_on
                        target:
                          entity_id: '{{ reclose_scene }}'
                      - if:
                          - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'') }}'
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: '{{ shading_status_helper }}'
