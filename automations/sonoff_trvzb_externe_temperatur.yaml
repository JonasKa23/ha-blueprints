blueprint:
  name: Sonoff TRVZB – externe Raumtemperatur übertragen
  description: >
    Überträgt den Wert eines Raumtemperatursensors in °C an ein Sonoff TRVZB
    über ZHA. Sendet bei Temperaturänderungen, beim Start von Home Assistant,
    nach Wiederverfügbarkeit der Sonoff-Entitäten und alle 30 Minuten erneut.
    Aktiviert den externen Sensormodus bei Bedarf.
    Voraussetzung: Home Assistant ab 2025.5.0 und TRVZB-Firmware ab 1.3.0.
    Die drei Entitäten werden ausdrücklich gewählt, damit auch übersetzte
    Entitäts-IDs funktionieren.
  domain: automation
  author: JonasKa23
  source_url: https://github.com/JonasKa23/ha-blueprints/blob/main/automations/sonoff_trvzb_externe_temperatur.yaml
  homeassistant:
    min_version: "2025.5.0"
  input:
    room_temperature:
      name: Raumtemperatursensor
      description: >
        Sensor mit Temperatur in °C. Es werden nur Werte größer als 0 °C und
        kleiner als 50 °C übertragen; die Grenzwerte selbst sind ausgeschlossen.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature
    external_temperature_value:
      name: Sonoff – Wert des externen Temperatursensors
      description: >
        ZHA-Zahlenentität für den externen Temperaturwert des TRVZB.
        Muss zum selben Thermostat wie der unten gewählte Schalter gehören.
      selector:
        entity:
          filter:
            domain: number
            integration: zha
    external_sensor_switch:
      name: Sonoff – externer Temperatursensor
      description: >
        ZHA-Schalter zum Aktivieren des externen Temperatursensors.
        Muss zum selben Thermostat wie die oben gewählte Zahlenentität gehören.
      selector:
        entity:
          filter:
            domain: switch
            integration: zha

variables:
  room_temperature: !input room_temperature

triggers:
  - trigger: state
    entity_id: !input room_temperature
    to: null
  - trigger: state
    entity_id:
      - !input external_temperature_value
      - !input external_sensor_switch
    from:
      - "unavailable"
      - "unknown"
    not_to:
      - "unavailable"
      - "unknown"
  - trigger: time_pattern
    minutes: "/30"
  - trigger: homeassistant
    event: start

conditions:
  - condition: numeric_state
    entity_id: !input room_temperature
    above: 0
    below: 50
  - condition: state
    entity_id: !input room_temperature
    attribute: unit_of_measurement
    state: "°C"
  # Erst senden, wenn beide Zielentitäten wieder verfügbar sind.
  - condition: not
    conditions:
      - condition: state
        entity_id: !input external_temperature_value
        state:
          - "unavailable"
          - "unknown"
  - condition: state
    entity_id: !input external_sensor_switch
    state:
      - "on"
      - "off"

actions:
  - action: number.set_value
    target:
      entity_id: !input external_temperature_value
    data:
      value: "{{ states(room_temperature) | float | round(1) }}"
  - if:
      - condition: state
        entity_id: !input external_sensor_switch
        state: "off"
    then:
      - action: switch.turn_on
        target:
          entity_id: !input external_sensor_switch

mode: restart
