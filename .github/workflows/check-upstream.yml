name: Check Better Thermostat upstream

'on':
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heating-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Report upstream changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_heating_upstream.py --create-issue
